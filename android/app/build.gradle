plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hengband.mobile'
    compileSdk 34

    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.hengband.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "3.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // リポジトリ直下の lib フォルダを直接 assets/lib として認識させる
    sourceSets {
        main {
            assets {
                srcDirs = ['src/main/assets', '../../lib']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    aaptOptions {
        noCompress 'txt', 'raw', 'prf'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
