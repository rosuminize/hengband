plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hengband.mobile'
    compileSdk 34

    // ★重要：C++20の最新機能を完全サポートするNDK 26を指定
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.hengband.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "3.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
