plugins {
    id 'com.android.application'
}

android {
    namespace 'org.hengband.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "org.hengband.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ARM_NEON=TRUE", "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a', 'armeabi-v7a' // Pixel 8などの現代のスマホ向け
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt" // 元々の変愚蛮怒のビルド設定を呼び出す
        }
    }

    sourceSets {
        main {
            // SDL2やゲームのデータ（assets）を格納する場所
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
