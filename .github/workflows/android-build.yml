name: Android Auto Build (Hengband Mobile)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # 手動でいつでもビルドを実行できるようにするボタン

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      # 後のステップでここにスマホ版UIへの「コード改変（パッチ当て）」の工程を追加します
      - name: Prepare Mobile Source Patches
        run: |
          echo "Applying mobile patches..."
          # ※この段階ではまだビルドが通るかの確認のため、基本構成のみをテストします

      - name: Build Android APK using Gradle
        run: |
          # Android用のビルドディレクトリを作成し、ビルドを実行します
          # (将来的に移植用Android/Gradleプロジェクトファイルをここに紐付けます)
          echo "Building Hengband.apk..."
          mkdir -p build-android
          # 仮の進捗ログを出力してビルド環境の検証を行います

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hengband-Mobile-APK
          path: |
            **/*.apk
