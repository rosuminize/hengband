name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update submodules
        run: |
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Copy game assets to android assets folder
        run: |
          mkdir -p android/app/src/main/assets/lib
          cp -r lib/* android/app/src/main/assets/lib/

      # パスを固定せず、リポジトリ全体から SDLActivity.java などのSDL関連Javaファイルを自動探索して配置
      - name: Copy SDL2 java sources
        run: |
          mkdir -p android/app/src/main/java/org/libsdl/app
          find . -type f -name "SDLActivity.java" -exec dirname {} \; | head -n 1 | xargs -I {} cp -r {}/*.java android/app/src/main/java/org/libsdl/app/

      - name: Build with Gradle
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hengband-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
