name: Android Auto Build (Hengband Mobile)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Checkout SDL2 and Extension Libraries
        run: |
          mkdir -p external
          git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL.git external/SDL2
          git clone --depth 1 --branch release-2.8.x https://github.com/libsdl-org/SDL_image.git external/SDL2_image
          git clone --depth 1 --branch release-2.22.x https://github.com/libsdl-org/SDL_ttf.git external/SDL2_ttf

      - name: Fetch SDL2 Android Java Bindings
        run: |
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp -r external/SDL2/android-project/app/src/main/java/org/libsdl/app/* android/app/src/main/java/org/libsdl/app/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hengband-Mobile-APK
          path: android/app/build/outputs/apk/debug/*.apk
