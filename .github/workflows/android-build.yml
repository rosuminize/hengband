name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ★追加: Gradle 9 ではなく安定した Gradle 8.7 をセットアップする
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      # リポジトリ直下の lib/ を assets/lib/ へ確実に配置
      - name: Copy game assets to android assets folder
        run: |
          mkdir -p android/app/src/main/assets/lib
          cp -r lib/* android/app/src/main/assets/lib/

      # Gradle 8.7 でビルドを実行
      - name: Build with Gradle
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hengband-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
