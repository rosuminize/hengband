name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # SSH形式のサブモジュールURLをHTTPSに自動変換して確実に展開
      - name: Update submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

          # 万が一サブモジュールが空だった場合の自動クローン保護
          if [ ! -f "external/SDL2/CMakeLists.txt" ]; then
            echo "Submodules missing, cloning SDL2 repositories directly..."
            mkdir -p external
            rm -rf external/SDL2 external/SDL2_image external/SDL2_ttf
            git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL.git external/SDL2
            git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL_image.git external/SDL2_image
            git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL_ttf.git external/SDL2_ttf
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      # ゲームデータ（lib/）を assets/lib/ へ配置
      - name: Copy game assets to android assets folder
        run: |
          mkdir -p android/app/src/main/assets/lib
          cp -r lib/* android/app/src/main/assets/lib/

      # SDL2のJavaソース（SDLActivity等）を確実に配置
      - name: Copy SDL2 java sources
        run: |
          mkdir -p android/app/src/main/java/org/libsdl/app
          find external -type f -name "*.java" -path "*/org/libsdl/app/*" -exec cp -v {} android/app/src/main/java/org/libsdl/app/ \;
          echo "=== Copied SDL Java files ==="
          ls -la android/app/src/main/java/org/libsdl/app/

      # ビルド実行
      - name: Build with Gradle
        run: |
          cd android
          gradle assembleDebug

      # 成果物APKの保存
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hengband-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
