name: Android Auto Build (Hengband Mobile)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SDL2 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      - name: Fetch SDL2 Android Java Bindings
        run: |
          git clone --depth 1 -b SDL2 https://github.com/libsdl-org/SDL.git
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp -r SDL/android-project/app/src/main/java/org/libsdl/app/* android/app/src/main/java/org/libsdl/app/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hengband-Mobile-APK
          path: android/app/build/outputs/apk/debug/*.apk
