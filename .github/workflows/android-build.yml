name: Android Auto Build (Hengband Mobile)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5 # 警告を消すためにv5にアップデート
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Install SDL2 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3 # 安定してGradleを動かすための公式アクション

      - name: Build Android APK
        working-directory: ./android # 先ほど作ったandroidフォルダの中で実行
        run: |
          gradle assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hengband-Mobile-APK
          path: android/app/build/outputs/apk/debug/*.apk
